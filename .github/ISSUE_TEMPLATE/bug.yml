name: Report a problem
description: Something in Tecrys Vault doesn't work as it should
labels: [bug, new]
body:
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, so that we can do the same.
      placeholder: "1. Open …\n2. Click …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Mac, Windows x64, Windows ARM, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tecrys Vault version
      description: Shown in About Tecrys Vault, e.g. 0.1.0 (31).
    validations:
      required: true
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots or files
      description: Drag images or files here (zip it if GitHub refuses the type).
